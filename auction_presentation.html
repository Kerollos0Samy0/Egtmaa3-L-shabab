<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مزاد القيم والوزنات</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    #toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
    .toast { background-color: #10b981; color: white; padding: 12px 20px; border-radius: 8px; font-weight: bold; animation: fadeIn 0.3s ease-out forwards; }
  </style>
</head>
<body id="app-body" class="bg-slate-50 text-slate-900 antialiased min-h-screen w-full flex flex-col lg:flex-row relative">
  
  <div id="host-ui" class="w-full flex flex-col lg:flex-row min-h-screen relative">
      <div class="fixed top-2 right-2 md:top-6 md:right-6 flex flex-col items-center bg-white p-2 rounded-xl shadow-xl border border-slate-200 z-50">
        <p class="text-[10px] md:text-xs font-bold text-slate-700 mb-1">امسح لتسجيل فريقك</p>
        <img id="qr-image" src="" alt="..." class="w-16 h-16 md:w-24 md:h-24 bg-slate-100 flex items-center justify-center">
      </div>
      <div id="toast-container"></div>

      <!-- Floating Toggle Button -->
      <button onclick="toggleSidebar()" class="fixed bottom-6 left-6 md:bottom-8 md:left-8 bg-slate-800 text-white px-4 md:px-6 py-3 md:py-4 rounded-full shadow-2xl font-bold z-50 hover:bg-slate-900 transition-all hover:scale-105 flex items-center gap-2">
        🏆 إظهار/إخفاء النقاط
      </button>

      <div class="w-full lg:w-2/3 xl:w-3/4 min-h-[60vh] lg:h-screen relative flex items-center justify-center p-4 md:p-8 bg-slate-100 lg:overflow-y-auto transition-all duration-300" id="auction-container">
      </div>

      <!-- Single Leaderboard Sidebar -->
      <div id="sidebar" class="w-full lg:w-1/3 xl:w-1/4 h-auto lg:h-screen border-t lg:border-t-0 lg:border-r border-slate-300 flex flex-col bg-white shadow-2xl z-10 pb-24 lg:pb-0 transition-all duration-300">
        <div class="flex-1 p-4 lg:p-5 flex flex-col bg-slate-50">
          <h3 class="text-xl md:text-2xl font-extrabold text-blue-800 flex items-center justify-center gap-2 mb-6 border-b-2 border-blue-200 pb-4">
            🏆 لوحة النقاط
          </h3>
          <div id="score-leaderboard" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
          
          <div class="mt-6 text-center flex flex-col gap-2 border-t-2 border-slate-200 pt-4">
            <button onclick="editTeamNames()" class="text-sm md:text-base font-bold text-slate-500 hover:text-blue-600 transition-colors p-2">
              ✏️ تعديل أسماء الفرق
            </button>
          </div>
        </div>
      </div>
  </div>

  <script>
    let teams = []; 
    let currentBids = {}; 
    let hostConnections = {}; 
    let lastMathResultHTML = '';
    let isSidebarVisible = true;

    let cards = [
      { type: 'trap', frontIcon: '📈🚀', frontTitle: 'النجاح السريع', frontDesc: 'ثروة مفاجئة ونجاح صاروخي بدون أي تعب.', frontFeatures: ['أرباح خيالية في أقل من شهر', 'نظرة انبهار من كل الناس'], backIcon: '🚨📉', backTitle: 'مفاجأة: الفخ!', backDesc: 'افتقار للخبرة الحياتية', backDetails: 'خسرت كل شيء سريعاً لأنك لم تبدأ من الصفر، ودخلت في دوامة ديون.' },
      
      { type: 'trap', frontIcon: '📱🤩', frontTitle: 'تريند السوشيال ميديا', frontDesc: 'ملايين المتابعين وشهرة واسعة جداً في أيام.', frontFeatures: ['عقود إعلانات خيالية', 'الكل بيتصور معاك في الشارع'], backIcon: '🚨👁️‍🗨️', backTitle: 'مفاجأة: الفخ!', backDesc: 'قيمتك أصبحت مرهونة باللايكات', backDetails: 'حملة هجوم قاسية دمرت نفسيتك وفقدت هويتك الحقيقية.' },
      
      { type: 'trap', frontIcon: '💍💑', frontTitle: 'الارتباط المثالي', frontDesc: 'شريك حياة شكله مبهر وغني جداً.', frontFeatures: ['حياة مليئة بالهدايا والسفر', 'مظهر اجتماعي رائع يحسدك عليه الجميع'], backIcon: '🚨⛓️', backTitle: 'مفاجأة: الفخ!', backDesc: 'التعلق المرضي (Toxic)', backDetails: 'يقلل من قيمتك دائماً وتعيش في وحدة قاتلة خلف الكواليس.' },
      
      { type: 'trap', frontIcon: '🎭🤝', frontTitle: 'القبول الاجتماعي', frontDesc: 'محبوب من الجميع بلا استثناء وتدخل أي مكان ترحب بك الناس.', frontFeatures: ['علاقات واسعة جداً', 'لا توجد أي صراعات أو خلافات'], backIcon: '🚨👻', backTitle: 'مفاجأة: الفخ!', backDesc: 'فقدت هويتك لإرضاء الجميع', backDetails: 'تلونت ولبست أقنعة كتير لحد ما نسيت أنت مين حقيقة.' },
      
      { type: 'trap', frontIcon: '🕊️🌍', frontTitle: 'الحرية المطلقة', frontDesc: 'استقلال تام بدون أي قيود أو سلطة عليك.', frontFeatures: ['سفر ومغامرات لا تنتهي', 'تفعل ما تشاء وقتما تشاء'], backIcon: '🚨🏝️', backTitle: 'مفاجأة: الفخ!', backDesc: 'عزلة تامة وافتقاد للسند', backDetails: 'في أول أزمة حقيقية لم تجد أي شخص يقف بجانبك.' },
      
      { type: 'trap', frontIcon: '👔👑', frontTitle: 'منصب قيادي مبكر', frontDesc: 'أصبحت مديراً لشركة كبرى في سن الـ 23 فقط.', frontFeatures: ['سلطة ومكتب فخم', 'راتب ضخم جداً'], backIcon: '🚨🥵', backTitle: 'مفاجأة: الفخ!', backDesc: 'متلازمة المحتال وضغط مدمر', backDetails: 'تعيش في رعب من أن ينكشف افتقارك للخبرة، وعجزت قبل الأوان.' },
      
      { type: 'trap', frontIcon: '✈️🧳', frontTitle: 'تأشيرة هجرة سريعة', frontDesc: 'فيزا مفاجئة لدولة أوروبية للبدء من جديد.', frontFeatures: ['حياة جديدة بالكامل', 'تذكرة ذهاب للنجاح المبهر'], backIcon: '🚨🚧', backTitle: 'مفاجأة: الفخ!', backDesc: 'هروب بلا هدف', backDetails: 'عمل شاق لا يناسب طموحك وإحساس مرعب بالضياع والغربة.' },
      
      { type: 'trap', frontIcon: '🧠✨', frontTitle: 'الشخصية العميقة المتفردة', frontDesc: 'تبدو أكثر ذكاءً وعمقاً من كل من حولك.', frontFeatures: ['تلفت الانتباه دائماً برأيك', 'الجميع يستمع لنقدك وانتقاداتك'], backIcon: '🚨☣️', backTitle: 'مفاجأة: الفخ!', backDesc: 'التمرد الدائم والشخصية السامة', backDetails: 'خسرت كل من يحبونك بسبب نقدك اللاذع وتعاليك عليهم.' },
      
      { type: 'treasure', frontIcon: '🏢💡', frontTitle: 'تأسيس مشروعك الخاص', frontDesc: 'بدء شركتك الخاصة أو مشروعك المستقل اللي بتحلم بيه.', frontFeatures: ['أنت مدير نفسك', 'أرباح محتملة وتطور سريع جداً'], backIcon: '💎🏆', backTitle: 'الكنز المخفي!', backDesc: 'الدرس العملي والصلابة', backDetails: 'حتى لو واجهت فشل ومشاكل في البداية، الخبرة دي بنت شخصيتك وأسست لنجاح أسطوري بعدها.' },
      
      { type: 'treasure', frontIcon: '🤝🔥', frontTitle: 'دائرة أصدقاء قوية', frontDesc: 'شلة مميزة وشخصياتهم قوية ومؤثرة.', frontFeatures: ['قعدة ممتعة دايماً', 'صراحة وجرأة في التعامل'], backIcon: '💎🛡️', backTitle: 'الكنز المخفي!', backDesc: 'حائط صد ضد التوهان', backDetails: 'الأصدقاء دول واجهوك بعيوبك ومنعوك تضيع، ووقفوا في ظهرك وقت الأزمات الصعبة.' },
      
      { type: 'treasure', frontIcon: '🧘‍♂️📚', frontTitle: 'سنة من الهدوء والاستقرار', frontDesc: 'روتين مريح، دراسة وعمل في هدوء تام.', frontFeatures: ['ابتعاد عن الدوشة والدراما', 'وقت كبير جداً لنفسك'], backIcon: '💎🔑', backTitle: 'الكنز المخفي!', backDesc: 'اكتشاف الموهبة', backDetails: 'في الصمت والملل ده، أتقنت مهارة نادرة جداً جعلتك مطلوباً ومميزاً في كل مكان.' },
      
      { type: 'treasure', frontIcon: '🔄🚪', frontTitle: 'فرصة لتغيير المسار', frontDesc: 'انتقال مفاجئ لمكان جديد أو مجال دراسة مختلف.', frontFeatures: ['مغامرة جديدة وتحدي', 'أشخاص جدد وبيئة مختلفة'], backIcon: '💎🚪', backTitle: 'الكنز المخفي!', backDesc: 'العناية الإلهية', backDetails: 'التغيير والرفض اللي اتعرضتله حماك من بيئة سامة كانت هتدمرك، ووجهك لاكتشاف شغفك الحقيقي.' },
      
      { type: 'treasure', frontIcon: '👴👑', frontTitle: 'علاقة بشخصية حكيمة VIP', frontDesc: 'شخص ناجح وخبرة بيهتم بيك وبيدعمك.', frontFeatures: ['نصائح ذهبية واسعة', 'اهتمام شخصي بتطورك'], backIcon: '💎🧭', backTitle: 'الكنز المخفي!', backDesc: 'البوصلة والمرشد', backDetails: 'الشخص ده كان صارم معاك أحياناً، بس حماك من التفكير المفرط ورجعلك سلامك الداخلي.' },
      
      { type: 'treasure', frontIcon: '🪙🌱', frontTitle: 'الاستقلال المالي التام', frontDesc: 'معاك اللي يغطي احتياجاتك ومفيش عليك أي ديون.', frontFeatures: ['عدم الاعتماد على أي شخص', 'مظهر بسيط ومريح'], backIcon: '💎🧘', backTitle: 'الكنز المخفي!', backDesc: 'صفر ديون = حرية مطلقة', backDetails: 'لأنك زهدت في المظاهر والماركات، تملكت راحة البال ولم تخضع لضغوط الماديات أبداً.' },
      
      { type: 'treasure', frontIcon: '🗣️🛡️', frontTitle: 'الشجاعة والمواجهة', frontDesc: 'القدرة على التحدث بجرأة أمام الجميع.', frontFeatures: ['قوة شخصية ملحوظة', 'صراحة مطلقة مع النفس والغير'], backIcon: '💎🕊️', backTitle: 'الكنز المخفي!', backDesc: 'التحرر من عقدة الذنب', backDetails: 'شجاعتك في الاعتراف بخطأ كارثي كسبتك احترام العقلاء وحررتك من جلد الذات.' },
      
      { type: 'treasure', frontIcon: '🚀🎨', frontTitle: 'اكتشاف شغف جديد', frontDesc: 'مجال جديد بتدخله بكل طاقتك وحماسك.', frontFeatures: ['طاقة إيجابية رهيبة', 'تركيز كامل في شيء بتحبه'], backIcon: '💎🔥', backTitle: 'الكنز المخفي!', backDesc: 'البداية الحقيقية', backDetails: 'الشغف ده خلاك تضحي وتستغنى بشجاعة، وحماك من إنك تعيش كعجوز في مكان مابيشبهكش.' }
    ];

    let currentStep = 'welcome';
    let currentCardIndex = 0;

    const urlParams = new URLSearchParams(window.location.search);
    const joinId = urlParams.get('join');
    let peer;

    if (joinId) {
      document.getElementById('host-ui').style.display = 'none';
      initClient(joinId);
    } else {
      initHost();
    }

    function toggleSidebar() {
      isSidebarVisible = !isSidebarVisible;
      const sidebar = document.getElementById('sidebar');
      const main = document.getElementById('auction-container');
      
      if (isSidebarVisible) {
        sidebar.style.display = 'flex';
        main.classList.remove('lg:w-full');
        main.classList.add('lg:w-2/3', 'xl:w-3/4');
      } else {
        sidebar.style.display = 'none';
        main.classList.remove('lg:w-2/3', 'xl:w-3/4');
        main.classList.add('lg:w-full');
      }
    }

    function initHost() {
      peer = new Peer();
      peer.on('open', (id) => {
        let baseUrl = window.location.href.split('?')[0];
        const clientUrl = `${baseUrl}?join=${id}`;
        document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(clientUrl)}`;
      });

      peer.on('connection', (conn) => {
        conn.on('data', (data) => {
          if (data.type === 'REGISTER') {
            if (teams.length >= 4) {
              conn.send({ type: 'MSG', msg: 'اكتمل العدد الأقصى للفرق (4).' });
              return;
            }
            const newTeam = { id: teams.length + 1, name: data.name, score: 1000 };
            teams.push(newTeam);
            hostConnections[newTeam.id] = conn;
            
            conn.send({ type: 'REGISTERED', team: newTeam });
            showToast(`🎉 انضم ${newTeam.name} بنجاح!`);
            
            renderSidebars();
            if (currentStep === 'welcome') renderAuction();
            
          } else if (data.type === 'BID') {
            currentBids[data.teamId] = data.bid;
            showToast(`✅ ${teams.find(t=>t.id===data.teamId)?.name} أرسل تسعيرته`);
            if (currentStep === 'front') renderAuction(); 
          }
        });
      });

      renderSidebars();
      renderAuction();
    }

    function broadcast(data) {
      Object.values(hostConnections).forEach(conn => {
        if(conn.open) conn.send(data);
      });
    }

    function initClient(hostId) {
      const body = document.getElementById('app-body');
      body.className = "bg-slate-100 text-slate-900 flex flex-col items-center min-h-screen p-6";
      
      function renderRegister() {
        body.innerHTML = `
          <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl mt-10 text-center fade-in border border-slate-200">
             <h1 class="text-3xl font-extrabold text-blue-700 mb-6">تسجيل فريق جديد 🚀</h1>
             <input type="text" id="mobileName" class="w-full p-4 text-xl border border-slate-300 rounded-xl mb-6 text-center" placeholder="اكتب اسم فريقك هنا...">
             <button id="regBtn" onclick="registerMobile()" class="w-full py-4 bg-amber-500 hover:bg-amber-600 text-white text-xl font-bold rounded-xl disabled:opacity-50">جاري الاتصال...</button>
             <div id="c-msg" class="mt-4 font-bold text-red-500 hidden"></div>
          </div>
        `;
      }
      renderRegister();

      peer = new Peer();
      let conn;
      let myTeam = null;
      
      peer.on('open', () => {
        conn = peer.connect(hostId);
        conn.on('open', () => {
          const btn = document.getElementById('regBtn');
          if(btn) { btn.innerText = "إنضمام للمزاد"; btn.classList.add('bg-blue-600'); }
        });

        conn.on('data', (data) => {
          if (data.type === 'REGISTERED') {
            myTeam = data.team;
            body.innerHTML = `<div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl mt-10 text-center fade-in border border-emerald-300"><div class="text-6xl mb-4">✅</div><h2 class="text-2xl font-bold text-emerald-700 mb-2">أهلاً ${myTeam.name}</h2><p class="text-slate-500 font-bold">أنت الفريق رقم ${myTeam.id}. في انتظار بدء المزاد...</p></div>`;
          } else if (data.type === 'MSG') {
            alert(data.msg);
          } else if (data.type === 'NEW_CARD') {
            body.innerHTML = `
              <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl mt-10 text-center fade-in border border-slate-200">
                 <h2 class="text-xl font-bold text-slate-800 mb-2">المعروض: ${data.cardTitle}</h2>
                 <p class="text-sm text-slate-500 mb-6">أدخل السعر السري لفريقك (${myTeam.name})</p>
                 <input type="number" id="mobileBid" class="w-full p-4 text-2xl border border-slate-300 rounded-xl mb-6 text-center" placeholder="السعر بالنقط...">
                 <button onclick="sendMobileBid()" class="w-full py-4 bg-blue-600 text-white text-2xl font-bold rounded-xl shadow-lg">إرسال السعر 🚀</button>
              </div>
            `;
          } else if (data.type === 'WAIT') {
            body.innerHTML = `<div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl mt-10 text-center fade-in border border-blue-300"><div class="text-6xl mb-4">⏳</div><h2 class="text-2xl font-bold text-blue-700 mb-2">تم إرسال سعرك!</h2><p class="text-slate-500 font-bold">ركز مع الشاشة الرئيسية لمعرفة النتيجة...</p></div>`;
          }
        });
      });

      window.registerMobile = function() {
        if (!conn || !conn.open) return;
        const name = document.getElementById('mobileName').value.trim();
        if(!name) { alert("اكتب اسم الفريق!"); return; }
        conn.send({ type: 'REGISTER', name: name });
      };

      window.sendMobileBid = function() {
        const bid = document.getElementById('mobileBid').value;
        if (bid === '') { alert('يرجى كتابة السعر!'); return; }
        conn.send({ type: 'BID', teamId: myTeam.id, bid: parseInt(bid) });
        conn.send({type: 'TRIGGER_WAIT_SCREEN'}); 
        body.innerHTML = `<div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl mt-10 text-center fade-in"><h2 class="text-2xl font-bold text-blue-700">تم الإرسال ⏳</h2><p>ركز مع الشاشة!</p></div>`;
      };
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerText = message;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
    }

    function editTeamNames() {
      let changed = false;
      teams.forEach(team => {
        let newName = prompt(`أدخل الاسم الجديد لـ "${team.name}":`, team.name);
        if(newName && newName.trim() !== '') {
          team.name = newName.trim();
          changed = true;
        }
      });
      if (changed) {
        renderSidebars();
        if(currentStep === 'front' || currentStep === 'welcome') renderAuction();
      }
    }

    function renderSidebars() {
      const scoreContainer = document.getElementById('score-leaderboard');
      const sortedTeams = [...teams].sort((a, b) => b.score - a.score);

      scoreContainer.innerHTML = sortedTeams.map((t, idx) => `
        <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200 shadow-sm mb-3">
          <div class="flex items-center gap-3">
            <span class="font-bold w-8 h-8 flex items-center justify-center rounded-full text-lg ${idx===0?'bg-amber-100 text-amber-700':'bg-slate-100 text-slate-700'}">${idx+1}</span>
            <span class="font-bold text-lg truncate">${t.name}</span>
          </div>
          <span class="font-black text-xl text-blue-700" dir="ltr">${t.score} 💰</span>
        </div>`).join('');
    }

    function renderAuction() {
      const auctionContainer = document.getElementById('auction-container');
      auctionContainer.innerHTML = '';
      
      if (currentStep === 'welcome') {
        const joinedList = teams.map(t => `<span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold shadow-sm">${t.name} ✅</span>`).join(' ');
        const emptySlotsCount = 4 - teams.length;
        const emptySlots = Array(emptySlotsCount).fill('<span class="bg-slate-200 text-slate-500 px-3 py-1 rounded-full border border-dashed border-slate-400">في انتظار انضمام فريق...</span>').join(' ');

        auctionContainer.innerHTML = `
          <div class="fade-in bg-white p-6 md:p-10 rounded-3xl shadow-xl w-full max-w-3xl text-center border border-slate-200 mt-12 lg:mt-0">
            <div class="text-6xl md:text-8xl mb-4 md:mb-6">🎙️🔨</div>
            <h1 class="text-3xl md:text-5xl font-extrabold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-amber-500 to-orange-700">مزاد القيم والوزنات</h1>
            
            <div class="my-8 bg-slate-50 p-4 rounded-xl border border-slate-200">
              <h3 class="font-bold text-lg mb-3">الفرق المنضمة للمزاد (${teams.length}/4):</h3>
              <div class="flex flex-wrap gap-2 justify-center">${joinedList} ${emptySlots}</div>
            </div>

            <button onclick="startAuction()" class="bg-blue-600 text-white px-8 py-4 rounded-2xl text-2xl font-bold shadow-lg hover:bg-blue-700 active:scale-95 transition-all disabled:opacity-50" ${teams.length === 0 ? 'disabled' : ''}>
              ${teams.length === 0 ? 'في انتظار فريق واحد على الأقل...' : 'بدء المزاد 🛒'}
            </button>
          </div>
        `;
      } 
      else if (currentStep === 'front') {
        const card = cards[currentCardIndex];
        
        const statuses = teams.map(t => {
          const hasBid = currentBids[t.id] !== undefined;
          return `
            <div class="flex items-center justify-between bg-white p-3 rounded-xl border ${hasBid ? 'border-emerald-400 bg-emerald-50' : 'border-slate-300'} shadow-sm">
              <div class="font-bold text-slate-800 text-sm md:text-lg">${t.name} (نقاطه: ${t.score})</div>
              <div class="font-bold ${hasBid ? 'text-emerald-600' : 'text-slate-400'}">${hasBid ? 'تم إرسال السعر ✅' : 'في الانتظار... ⏳'}</div>
            </div>
          `;
        }).join('');

        const allBidded = teams.every(t => currentBids[t.id] !== undefined) && teams.length > 0;

        auctionContainer.innerHTML = `
          <div class="fade-in bg-white p-5 md:p-10 rounded-3xl shadow-xl w-full max-w-3xl text-center border border-slate-200 mt-12 lg:mt-0">
            <div class="text-5xl md:text-7xl mb-3">${card.frontIcon}</div>
            <div class="text-slate-500 font-bold text-sm mb-2">المعروض ${currentCardIndex + 1} من ${cards.length}</div>
            <h2 class="text-2xl md:text-4xl font-bold mb-3 text-slate-900">${card.frontTitle}</h2>
            <p class="text-lg md:text-xl text-slate-600 mb-6 font-semibold">${card.frontDesc}</p>
            <div class="flex justify-center gap-2 mb-6">
              ${card.frontFeatures.map(f => `<span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-bold border border-blue-200">${f}</span>`).join('')}
            </div>
            
            <div class="bg-slate-100 p-4 rounded-2xl border border-slate-200 mb-5 flex flex-col gap-3 text-right">
              <h3 class="font-bold text-base text-slate-800">حالة مزايدة الفرق:</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">${statuses}</div>
            </div>

            <button onclick="revealBidsScreen()" class="bg-amber-600 text-white px-6 py-4 rounded-xl text-xl font-bold shadow-lg hover:bg-amber-700 transition-all w-full ${!allBidded ? 'animate-pulse' : ''}">
              ${allBidded ? 'كل الفرق جاهزة! إغلاق المزاد وإعلان الأسعار 🔨' : 'إغلاق المزاد فوراً (تخطي المنتظرين) 🔨'}
            </button>
          </div>
        `;
      } 
      else if (currentStep === 'reveal_bids') {
        const bidResults = teams.map(t => {
          const bidAmount = currentBids[t.id] !== undefined ? currentBids[t.id] : 0;
          return `
            <div class="flex items-center justify-between p-4 rounded-xl border-2 border-slate-300 bg-white shadow-sm">
              <div class="font-bold text-slate-800 text-xl">${t.name}</div>
              <div class="font-black text-3xl text-blue-700">${bidAmount}</div>
            </div>
          `;
        }).join('');

        auctionContainer.innerHTML = `
          <div class="fade-in bg-white p-5 md:p-10 rounded-3xl shadow-xl w-full max-w-3xl text-center border border-slate-200 mt-12 lg:mt-0">
            <h2 class="text-3xl font-extrabold mb-6 text-slate-800">الأسعار اللي اتسجلت في السر 🤫</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">${bidResults}</div>
            <p class="text-lg text-slate-600 font-bold mb-6">يا ترى المعروض ده كنز ولا فخ؟ ومين اللي كسب؟ 🤔</p>
            <button onclick="showBackCard()" class="bg-blue-600 text-white px-8 py-4 rounded-xl text-2xl font-bold shadow-lg hover:bg-blue-700 w-full animate-bounce">
              اكشف حقيقة الكارت والنتيجة 🔍
            </button>
          </div>
        `;
      }
      else if (currentStep === 'back') {
        const card = cards[currentCardIndex];
        const isTrap = card.type === 'trap';
        
        auctionContainer.innerHTML = `
          <div class="fade-in bg-white p-5 md:p-10 rounded-3xl shadow-xl w-full max-w-3xl text-center border mt-12 lg:mt-0">
            <div class="text-5xl md:text-7xl mb-4 ${isTrap ? 'animate-pulse' : 'animate-bounce'}">${card.backIcon}</div>
            <h2 class="text-2xl md:text-4xl font-extrabold mb-4 ${isTrap?'text-red-700':'text-emerald-700'}">${card.backTitle}</h2>
            <p class="text-slate-600 text-lg md:text-2xl mb-6">${card.backDesc}</p>
            
            <!-- نتيجة العملية الحسابية -->
            ${lastMathResultHTML}

            <button onclick="nextCard()" class="mt-8 bg-slate-800 text-white px-8 py-4 rounded-xl text-xl font-bold w-full hover:bg-slate-900 transition-colors shadow-lg">المعروض التالي ➡️</button>
          </div>
        `;
      }
    }

    function revealBidsScreen() {
      if (teams.length === 0) return;
      currentStep = 'reveal_bids';
      renderAuction();
    }

    function showBackCard() {
      const card = cards[currentCardIndex];
      const isTrap = card.type === 'trap';
      
      let maxBid = -1;
      let minBid = Infinity;
      
      teams.forEach(t => {
        let bid = currentBids[t.id] !== undefined ? currentBids[t.id] : 0;
        if (bid > maxBid) maxBid = bid;
        if (bid < minBid) minBid = bid;
      });

      let maxTeams = teams.filter(t => (currentBids[t.id]||0) === maxBid);
      let minTeams = teams.filter(t => (currentBids[t.id]||0) === minBid);

      lastMathResultHTML = '';

      if (isTrap) {
        lastMathResultHTML += `<div class="bg-red-50 p-5 rounded-2xl border-2 border-red-300 mt-6 text-right"><h3 class="font-extrabold text-red-800 text-2xl mb-4 text-center border-b border-red-200 pb-2">🚨 نتيـجـة الفـــخ 🚨</h3><div class="space-y-3">`;
        teams.forEach(t => {
            let bid = currentBids[t.id] || 0;
            if (minTeams.includes(t)) {
                t.score += 100; // Bonus for escaping
                lastMathResultHTML += `<div class="bg-emerald-100 text-emerald-800 p-3 rounded-lg font-bold text-lg flex justify-between"><span>نجا (${t.name}) لأنه أقل مراهن! 🎉</span><span dir="ltr">+100 نقطة</span></div>`;
            } else {
                t.score -= bid; // Penalty
                lastMathResultHTML += `<div class="bg-red-100 text-red-800 p-3 rounded-lg font-bold text-lg flex justify-between"><span>وقع (${t.name}) في الفخ! ❌</span><span dir="ltr">خسر ${bid} نقطة</span></div>`;
            }
        });
        lastMathResultHTML += `</div></div>`;
      } else {
        lastMathResultHTML += `<div class="bg-emerald-50 p-5 rounded-2xl border-2 border-emerald-300 mt-6 text-right"><h3 class="font-extrabold text-emerald-800 text-2xl mb-4 text-center border-b border-emerald-200 pb-2">💎 نتيـجـة الكنـــز 💎</h3><div class="space-y-3">`;
        teams.forEach(t => {
            let bid = currentBids[t.id] || 0;
            if (maxTeams.includes(t)) {
                t.score += 300;
                lastMathResultHTML += `<div class="bg-emerald-100 text-emerald-800 p-3 rounded-lg font-bold text-lg flex justify-between"><span>فاز (${t.name}) بالكنز (أعلى مراهن)! 🎉</span><span dir="ltr">+300 نقطة</span></div>`;
            } else {
                lastMathResultHTML += `<div class="bg-slate-100 text-slate-500 p-3 rounded-lg font-bold text-lg flex justify-between"><span>فريق (${t.name}) حظ أوفر..</span><span>0 نقطة</span></div>`;
            }
        });
        lastMathResultHTML += `</div></div>`;
      }

      currentStep = 'back';
      renderSidebars(); // Update scores on the left
      renderAuction();
    }

    function startAuction() {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      currentStep = 'front';
      currentCardIndex = 0;
      currentBids = {};
      teams.forEach(t => t.score = 1000); // Reset scores
      broadcast({ type: 'NEW_CARD', cardTitle: cards[currentCardIndex].frontTitle });
      renderSidebars();
      renderAuction();
    }

    function nextCard() {
      currentStep = 'front';
      currentCardIndex++;
      currentBids = {};
      if (currentCardIndex >= cards.length) {
          document.getElementById('auction-container').innerHTML = `<h1 class="text-5xl font-black text-amber-500">انتهى المزاد! 🏁</h1>`;
          return;
      }
      broadcast({ type: 'NEW_CARD', cardTitle: cards[currentCardIndex].frontTitle });
      renderAuction();
    }

  </script>
</body>
</html>
