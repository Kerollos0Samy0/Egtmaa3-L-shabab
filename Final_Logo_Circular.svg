<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
    <!-- Background -->
    <rect width="100%" height="100%" fill="#ffffff" />
    
    <!-- Embedded Logo Mark -->
    <!-- Scaled slightly to fit inside the text circle -->
    <image href="logo_icon.jpg" x="250" y="250" width="500" height="500" />
    
    <defs>
        <!-- Top Semi-Circle for Coptic (Left to Right, arching up) -->
        <path id="topArc" d="M 120, 500 A 380, 380 0 0,1 880, 500" fill="none" />
        
        <!-- Bottom Semi-Circle for Arabic (Left to Right, arching down) -->
        <path id="bottomArc" d="M 120, 500 A 380, 380 0 0,0 880, 500" fill="none" />
    </defs>
    
    <!-- Coptic Text (Top) -->
    <text font-family="sans-serif" font-size="30" font-weight="bold" fill="#c49a45" dominant-baseline="middle" letter-spacing="2">
        <textPath href="#topArc" startOffset="50%" text-anchor="middle">
            Ϯⲉⲕⲕⲗⲏⲥⲓⲁ ⲛ̀ⲧⲉ Ϯⲛⲏⲃ Ϯⲡⲁⲣⲑⲉⲛⲟⲥ Ⲙⲁⲣⲓⲁ ⲉⲧϧⲉⲛ Ⲉⲗⲕⲁⲛⲁⲧⲉⲣ Ⲉⲗⲭⲁⲓⲣⲓⲁ
        </textPath>
    </text>
    
    <!-- Arabic Text (Bottom) -->
    <text font-family="'Cairo', 'Amiri', 'Arial', sans-serif" font-size="55" font-weight="bold" fill="#3b7b9f" dominant-baseline="middle" direction="rtl">
        <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
            كنيسة السيدة العذراء بالقناطر
        </textPath>
    </text>
</svg>
