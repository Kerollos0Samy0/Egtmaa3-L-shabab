<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مزاد القيم والوزنات</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    #toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
    .toast { background-color: #10b981; color: white; padding: 12px 20px; border-radius: 8px; font-weight: bold; animation: fadeIn 0.3s ease-out forwards; }
  </style>
</head>
<body id="app-body" class="bg-slate-50 text-slate-900 antialiased min-h-screen w-full flex flex-col lg:flex-row relative">
  
  <div id="host-ui" class="w-full flex flex-col lg:flex-row min-h-screen">
      <div class="fixed top-2 right-2 md:top-6 md:right-6 flex flex-col items-center bg-white p-2 rounded-xl shadow-xl border border-slate-200 z-50">
        <p class="text-[10px] md:text-xs font-bold text-slate-700 mb-1">امسح لتسجيل فريقك</p>
        <img id="qr-image" src="" alt="..." class="w-16 h-16 md:w-24 md:h-24 bg-slate-100 flex items-center justify-center">
      </div>
      <div id="toast-container"></div>

      <div class="w-full lg:w-2/3 xl:w-3/4 min-h-[60vh] lg:h-screen relative flex items-center justify-center p-4 md:p-8 bg-slate-100 lg:overflow-y-auto" id="auction-container">
      </div>

      <div class="w-full lg:w-1/3 xl:w-1/4 min-h-[40vh] lg:h-screen border-t lg:border-t-0 lg:border-r border-slate-300 flex flex-col bg-white shadow-2xl z-10 pb-8 lg:pb-0">
        <div class="min-h-[250px] lg:h-1/2 p-4 lg:p-5 flex flex-col border-b border-slate-300 bg-emerald-50">
          <h3 class="text-lg md:text-xl font-extrabold text-emerald-800 flex items-center gap-2 mb-4">🏆 ترتيب القيمة</h3>
          <div id="value-leaderboard" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
        </div>
        <div class="min-h-[250px] lg:h-1/2 p-4 lg:p-5 flex flex-col bg-blue-50">
          <h3 class="text-lg md:text-xl font-extrabold text-blue-800 flex items-center gap-2 mb-4">💰 الرصيد المتبقي</h3>
          <div id="budget-leaderboard" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
        </div>
      </div>
  </div>

  <script>
    let teams = []; 
    let currentBids = {}; 
    let hostConnections = {}; 

    let cards = [
      { type: 'trap', valueScore: 100, frontIcon: '📈🚀', frontTitle: 'النجاح السريع', frontDesc: 'ثروة مفاجئة ونجاح صاروخي بدون تدرج.', frontFeatures: ['أرباح خيالية في أقل من شهر', 'نظرة انبهار من كل الناس'], backIcon: '🚨📉', backTitle: 'مفاجأة: الفخ!', backDesc: 'افتقار للخبرة الحياتية', backDetails: 'خسرت كل شيء سريعاً لأنك لم تبدأ من الصفر.' },
      { type: 'trap', valueScore: 100, frontIcon: '📱🤩', frontTitle: 'تريند السوشيال ميديا', frontDesc: 'ملايين المتابعين وشهرة واسعة جداً.', frontFeatures: ['عقود إعلانات خيالية', 'الكل بيتصور معاك'], backIcon: '🚨👁️‍🗨️', backTitle: 'مفاجأة: الفخ!', backDesc: 'قيمتك أصبحت مرهونة باللايكات', backDetails: 'حملة هجوم قاسية دمرت نفسيتك وفقدت هويتك.' },
      { type: 'trap', valueScore: 100, frontIcon: '💍💑', frontTitle: 'الارتباط المثالي', frontDesc: 'شريك حياة شكله مبهر وغني جداً.', frontFeatures: ['حياة مليئة بالهدايا', 'مظهر اجتماعي رائع'], backIcon: '🚨⛓️', backTitle: 'مفاجأة: الفخ!', backDesc: 'شريك سام (Toxic)', backDetails: 'يقلل من قيمتك دائماً وتعيش في وحدة قاتلة.' },
      { type: 'trap', valueScore: 100, frontIcon: '🎭🤝', frontTitle: 'القبول الاجتماعي', frontDesc: 'محبوب من الجميع بلا استثناء.', frontFeatures: ['علاقات واسعة', 'لا توجد صراعات'], backIcon: '🚨👻', backTitle: 'مفاجأة: الفخ!', backDesc: 'فقدت هويتك لإرضاء الجميع', backDetails: 'تلونت حتى نسيت من أنت حقيقة.' },
      { type: 'trap', valueScore: 100, frontIcon: '🕊️🌍', frontTitle: 'الحرية المطلقة', frontDesc: 'استقلال تام بدون أي قيود.', frontFeatures: ['تفعل ما تشاء', 'حياة مليئة بالمغامرات'], backIcon: '🚨🏝️', backTitle: 'مفاجأة: الفخ!', backDesc: 'عزلة تامة وافتقاد للسند', backDetails: 'في أول أزمة لم تجد من يقف بجانبك.' },
      { type: 'trap', valueScore: 100, frontIcon: '👔👑', frontTitle: 'منصب قيادي بالواسطة', frontDesc: 'مدير في سن الـ 23.', frontFeatures: ['سلطة ومكتب فخم', 'راتب ضخم'], backIcon: '🚨🥵', backTitle: 'مفاجأة: الفخ!', backDesc: 'متلازمة المحتال وضغط مدمر', backDetails: 'تعيش في رعب من أن ينكشف افتقارك للخبرة.' },
      { type: 'trap', valueScore: 100, frontIcon: '✈️🧳', frontTitle: 'الهجرة غير المخططة', frontDesc: 'سفر فوري للهروب من واقعك.', frontFeatures: ['تذكرة ذهاب فقط', 'حياة جديدة'], backIcon: '🚨🚧', backTitle: 'مفاجأة: الفخ!', backDesc: 'هروب بلا هدف', backDetails: 'عمل شاق لا يناسب طموحك وإحساس بالضياع.' },
      { type: 'trap', valueScore: 100, frontIcon: '🗣️🔥', frontTitle: 'التمرد الدائم', frontDesc: 'الاعتراض الدائم على كل شيء.', frontFeatures: ['تبدو شخصاً عميقاً', 'تلفت الانتباه'], backIcon: '🚨☣️', backTitle: 'مفاجأة: الفخ!', backDesc: 'شخصية سامة', backDetails: 'خسرت كل من يحبونك بسبب نقدك اللاذع.' },
      { type: 'treasure', valueScore: 500, frontIcon: '📉🤦', frontTitle: 'فشل في مشروعك الأول', frontDesc: 'خسرت كل مدخراتك.', frontFeatures: ['إحباط مؤقت', 'نظرة شفقة من الناس'], backIcon: '💎🏆', backTitle: 'الكنز المخفي!', backDesc: 'الدرس العملي', backDetails: 'هذه الخبرة جعلتك تبني مشروعاً أسطورياً بعدها.' },
      { type: 'treasure', valueScore: 500, frontIcon: '🗣️😠', frontTitle: 'صديق مستفز يواجهك', frontDesc: 'صديق ينتقدك دائماً.', frontFeatures: ['مجادلات مستمرة', 'لا يجاملك'], backIcon: '💎🛡️', backTitle: 'الكنز المخفي!', backDesc: 'حائط صد ضد التوهان', backDetails: 'وقف في ظهرك وقت الأزمات عندما هرب الآخرون.' },
      { type: 'treasure', valueScore: 500, frontIcon: '⏳🥱', frontTitle: 'سنة من الملل والروتين', frontDesc: 'دراسة وعمل في صمت.', frontFeatures: ['حياة كئيبة للآخرين', 'انعزال للتركيز'], backIcon: '💎🔑', backTitle: 'الكنز المخفي!', backDesc: 'اكتشاف الموهبة', backDetails: 'أتقنت مهارة نادرة جعلتك مطلوباً في كل مكان.' },
      { type: 'treasure', valueScore: 500, frontIcon: '🚫🏢', frontTitle: 'الرفض في الانترفيو', frontDesc: 'تلقيت إيميل رفض.', frontFeatures: ['إحباط ورفض', 'تأخر مؤقت'], backIcon: '💎🚪', backTitle: 'الكنز المخفي!', backDesc: 'عناية إلهية', backDetails: 'حماك من بيئة سامة ودفعك لاكتشاف شغفك.' },
      { type: 'treasure', valueScore: 500, frontIcon: '📖🤨', frontTitle: 'مرشد روحي صارم', frontDesc: 'يحاسبك ويضغط عليك.', frontFeatures: ['تكليفات روحية مستمرة', 'تقييد لبعض الحريات'], backIcon: '💎🧭', backTitle: 'الكنز المخفي!', backDesc: 'البوصلة', backDetails: 'يحميك من التفكير المفرط ويعيد لك سلامك الداخلي.' },
      { type: 'treasure', valueScore: 500, frontIcon: '🚲💸', frontTitle: 'حياة الاستغناء', frontDesc: 'لا تركض وراء الماركات.', frontFeatures: ['مظهر بسيط', 'الناس تظنك فقيراً'], backIcon: '💎🧘', backTitle: 'الكنز المخفي!', backDesc: 'صفر ديون = حرية مطلقة', backDetails: 'تملك راحة البال ولا تخضع لضغوط الماديات.' },
      { type: 'treasure', valueScore: 500, frontIcon: '🙇‍♂️💔', frontTitle: 'الاعتراف بخطأ كارثي', frontDesc: 'الاعتذار أمام الجميع.', frontFeatures: ['إحراج شديد', 'كسر الكبرياء'], backIcon: '💎🕊️', backTitle: 'الكنز المخفي!', backDesc: 'التحرر والمرونة', backDetails: 'كسبت احترام العقلاء وتخلصت من عقدة الذنب.' },
      { type: 'treasure', valueScore: 500, frontIcon: '🔄🏗️', frontTitle: 'البداية من الصفر', frontDesc: 'تترك مجالاً ضيعت فيه 4 سنوات.', frontFeatures: ['الناس سيقولون مجنون', 'تأخرت عن دفعتك'], backIcon: '💎🔥', backTitle: 'الكنز المخفي!', backDesc: 'اكتشاف الشغف', backDetails: 'تعمل بشغف بدلاً من أن تعيش كعجوز في مكان لا يشبهك.' }
    ];

    let currentStep = 'welcome';
    let currentCardIndex = 0;
    let winningTeamId = null;
    let winningBid = 0;

    const urlParams = new URLSearchParams(window.location.search);
    const joinId = urlParams.get('join');
    let peer;

    if (joinId) {
      document.getElementById('host-ui').style.display = 'none';
      initClient(joinId);
    } else {
      initHost();
    }

    function initHost() {
      peer = new Peer();
      peer.on('open', (id) => {
        let baseUrl = window.location.href.split('?')[0];
        const clientUrl = `${baseUrl}?join=${id}`;
        document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(clientUrl)}`;
      });

      peer.on('connection', (conn) => {
        conn.on('data', (data) => {
          if (data.type === 'REGISTER') {
            if (teams.length >= 4) {
              conn.send({ type: 'MSG', msg: 'اكتمل العدد الأقصى للفرق (4).' });
              return;
            }
            const newTeam = { id: teams.length + 1, name: data.name, budget: 1000, valueScore: 0 };
            teams.push(newTeam);
            hostConnections[newTeam.id] = conn;
            
            conn.send({ type: 'REGISTERED', team: newTeam });
            showToast(`🎉 انضم ${newTeam.name} بنجاح!`);
            
            renderSidebars();
            if (currentStep === 'welcome') renderAuction();
            
          } else if (data.type === 'BID') {
            currentBids[data.teamId] = data.bid;
            showToast(`✅ ${teams.find(t=>t.id===data.teamId)?.name} أرسل تسعيرته`);
            if (currentStep === 'front') renderAuction(); 
          }
        });
      });

      renderSidebars();
      renderAuction();
    }

    function broadcast(data) {
      Object.values(hostConnections).forEach(conn => {
        if(conn.open) conn.send(data);
      });
    }

    function initClient(hostId) {
      const body = document.getElementById('app-body');
      body.className = "bg-slate-100 text-slate-900 flex flex-col items-center min-h-screen p-6";
      
      function renderRegister() {
        body.innerHTML = `
          <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl mt-10 text-center fade-in border border-slate-200">
             <h1 class="text-3xl font-extrabold text-blue-700 mb-6">تسجيل فريق جديد 🚀</h1>
             <input type="text" id="mobileName" class="w-full p-4 text-xl border border-slate-300 rounded-xl mb-6 text-center" placeholder="اكتب اسم فريقك هنا...">
             <button id="regBtn" onclick="registerMobile()" class="w-full py-4 bg-amber-500 hover:bg-amber-600 text-white text-xl font-bold rounded-xl disabled:opacity-50">جاري الاتصال...</button>
             <div id="c-msg" class="mt-4 font-bold text-red-500 hidden"></div>
          </div>
        `;
      }
      renderRegister();

      peer = new Peer();
      let conn;
      let myTeam = null;
      
      peer.on('open', () => {
        conn = peer.connect(hostId);
        conn.on('open', () => {
          const btn = document.getElementById('regBtn');
          if(btn) { btn.innerText = "إنضمام للمزاد"; btn.classList.add('bg-blue-600'); }
        });

        conn.on('data', (data) => {
          if (data.type === 'REGISTERED') {
            myTeam = data.team;
            body.innerHTML = `<div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl mt-10 text-center fade-in border border-emerald-300"><div class="text-6xl mb-4">✅</div><h2 class="text-2xl font-bold text-emerald-700 mb-2">أهلاً ${myTeam.name}</h2><p class="text-slate-500 font-bold">في انتظار بدء المزاد من الشاشة الرئيسية...</p></div>`;
          } else if (data.type === 'MSG') {
            alert(data.msg);
          } else if (data.type === 'NEW_CARD') {
            body.innerHTML = `
              <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl mt-10 text-center fade-in border border-slate-200">
                 <h2 class="text-xl font-bold text-slate-800 mb-2">المعروض: ${data.cardTitle}</h2>
                 <p class="text-sm text-slate-500 mb-6">أدخل السعر السري لفريقك (${myTeam.name})</p>
                 <input type="number" id="mobileBid" class="w-full p-4 text-2xl border border-slate-300 rounded-xl mb-6 text-center" placeholder="السعر...">
                 <button onclick="sendMobileBid()" class="w-full py-4 bg-blue-600 text-white text-2xl font-bold rounded-xl shadow-lg">إرسال السعر 🚀</button>
              </div>
            `;
          } else if (data.type === 'WAIT') {
            body.innerHTML = `<div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl mt-10 text-center fade-in border border-blue-300"><div class="text-6xl mb-4">⏳</div><h2 class="text-2xl font-bold text-blue-700 mb-2">تم إرسال سعرك!</h2><p class="text-slate-500 font-bold">ركز مع الشاشة الرئيسية لمعرفة الفائز...</p></div>`;
          }
        });
      });

      window.registerMobile = function() {
        if (!conn || !conn.open) return;
        const name = document.getElementById('mobileName').value.trim();
        if(!name) { alert("اكتب اسم الفريق!"); return; }
        conn.send({ type: 'REGISTER', name: name });
      };

      window.sendMobileBid = function() {
        const bid = document.getElementById('mobileBid').value;
        if (bid === '') { alert('يرجى كتابة السعر!'); return; }
        conn.send({ type: 'BID', teamId: myTeam.id, bid: parseInt(bid) });
        conn.send({type: 'TRIGGER_WAIT_SCREEN'}); // Client local simulation hack
        body.innerHTML = `<div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl mt-10 text-center fade-in"><h2 class="text-2xl font-bold text-blue-700">تم الإرسال ⏳</h2><p>ركز مع الشاشة!</p></div>`;
      };
    }

    // --- Host Functions ---
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerText = message;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
    }

    function renderSidebars() {
      const valContainer = document.getElementById('value-leaderboard');
      const budContainer = document.getElementById('budget-leaderboard');
      const sortedByValue = [...teams].sort((a, b) => b.valueScore - a.valueScore);
      const sortedByBudget = [...teams].sort((a, b) => b.budget - a.budget);

      const mapTeam = (t, idx, val, icon) => `
        <div class="flex items-center justify-between bg-white p-2 rounded-lg border shadow-sm mb-2">
          <div class="flex items-center gap-2"><span class="font-bold w-6 h-6 flex items-center justify-center rounded-full text-sm bg-slate-100">${idx+1}</span><span class="font-semibold text-sm truncate">${t.name}</span></div>
          <span class="font-black text-sm" dir="ltr">${val}${icon}</span>
        </div>`;
      
      valContainer.innerHTML = sortedByValue.map((t, idx) => mapTeam(t, idx, t.valueScore>0?'+'+t.valueScore:t.valueScore, '')).join('');
      budContainer.innerHTML = sortedByBudget.map((t, idx) => mapTeam(t, idx, t.budget, '💰')).join('');
    }

    function renderAuction() {
      const auctionContainer = document.getElementById('auction-container');
      auctionContainer.innerHTML = '';
      
      if (currentStep === 'welcome') {
        const joinedList = teams.map(t => `<span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold shadow-sm">${t.name} ✅</span>`).join(' ');
        const emptySlotsCount = 4 - teams.length;
        const emptySlots = Array(emptySlotsCount).fill('<span class="bg-slate-200 text-slate-500 px-3 py-1 rounded-full border border-dashed border-slate-400">في انتظار الانضمام...</span>').join(' ');

        auctionContainer.innerHTML = `
          <div class="fade-in bg-white p-6 md:p-10 rounded-3xl shadow-xl w-full max-w-3xl text-center border border-slate-200 mt-12 lg:mt-0">
            <div class="text-6xl md:text-8xl mb-4 md:mb-6">🎙️🔨</div>
            <h1 class="text-3xl md:text-5xl font-extrabold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-amber-500 to-orange-700">مزاد القيم والوزنات</h1>
            
            <div class="my-8 bg-slate-50 p-4 rounded-xl border border-slate-200">
              <h3 class="font-bold text-lg mb-3">الفرق المنضمة (${teams.length}/4):</h3>
              <div class="flex flex-wrap gap-2 justify-center">${joinedList} ${emptySlots}</div>
            </div>

            <button onclick="startAuction()" class="bg-blue-600 text-white px-8 py-4 rounded-2xl text-2xl font-bold shadow-lg hover:bg-blue-700 active:scale-95 transition-all disabled:opacity-50" ${teams.length === 0 ? 'disabled' : ''}>
              ${teams.length === 0 ? 'في انتظار فريق واحد على الأقل...' : 'بدء المزاد 🛒'}
            </button>
          </div>
        `;
      } 
      else if (currentStep === 'front') {
        const card = cards[currentCardIndex];
        
        // Secret bids statuses
        const statuses = teams.map(t => {
          const hasBid = currentBids[t.id] !== undefined;
          return `
            <div class="flex items-center justify-between bg-white p-3 rounded-xl border ${hasBid ? 'border-emerald-400 bg-emerald-50' : 'border-slate-300'} shadow-sm">
              <div class="font-bold text-slate-800 text-sm md:text-lg">${t.name} (رصيد: ${t.budget})</div>
              <div class="font-bold ${hasBid ? 'text-emerald-600' : 'text-slate-400'}">${hasBid ? 'تم إرسال السعر ✅' : 'في الانتظار... ⏳'}</div>
            </div>
          `;
        }).join('');

        const allBidded = teams.every(t => currentBids[t.id] !== undefined);

        auctionContainer.innerHTML = `
          <div class="fade-in bg-white p-5 md:p-10 rounded-3xl shadow-xl w-full max-w-3xl text-center border border-slate-200 mt-12 lg:mt-0">
            <div class="text-5xl md:text-7xl mb-3">${card.frontIcon}</div>
            <div class="text-slate-500 font-bold text-sm mb-2">المعروض ${currentCardIndex + 1} من ${cards.length}</div>
            <h2 class="text-2xl md:text-4xl font-bold mb-3 text-slate-900">${card.frontTitle}</h2>
            
            <div class="bg-slate-100 p-4 rounded-2xl border border-slate-200 mb-5 flex flex-col gap-3 text-right">
              <h3 class="font-bold text-base text-slate-800">حالة مزايدة الفرق:</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3">${statuses}</div>
            </div>

            <button onclick="revealAllAndCalculate()" class="bg-amber-600 text-white px-6 py-4 rounded-xl text-xl font-bold shadow-lg hover:bg-amber-700 transition-all w-full ${!allBidded ? 'animate-pulse' : ''}">
              ${allBidded ? 'كل الفرق جاهزة! إغلاق المزاد وإعلان الفائز 🔨' : 'إغلاق المزاد فوراً (تخطي المنتظرين) 🔨'}
            </button>
          </div>
        `;
      } 
      else if (currentStep === 'reveal_bids') {
        const card = cards[currentCardIndex];
        
        const bidResults = teams.map(t => {
          const bidAmount = currentBids[t.id] !== undefined ? currentBids[t.id] : 0;
          const isWinner = t.id === winningTeamId;
          return `
            <div class="flex items-center justify-between p-4 rounded-xl border-2 ${isWinner ? 'border-amber-400 bg-amber-50 scale-105' : 'border-slate-200 bg-white'} shadow-sm transition-all duration-500">
              <div class="font-bold text-slate-800 text-lg">${t.name}</div>
              <div class="font-black text-2xl ${isWinner ? 'text-amber-600' : 'text-slate-600'}">${bidAmount}</div>
            </div>
          `;
        }).join('');

        auctionContainer.innerHTML = `
          <div class="fade-in bg-white p-5 md:p-10 rounded-3xl shadow-xl w-full max-w-3xl text-center border border-slate-200 mt-12 lg:mt-0">
            <h2 class="text-3xl font-extrabold mb-6 text-slate-800">الأسعار المعروضة 💸</h2>
            <div class="grid grid-cols-1 gap-4 mb-8">${bidResults}</div>
            <div class="bg-amber-100 text-amber-800 p-4 rounded-xl font-bold text-2xl mb-6 shadow border border-amber-300">
              🎉 مبروك لفريق (${teams.find(t=>t.id==winningTeamId)?.name}) المزايدة بـ ${winningBid}!
            </div>
            <button onclick="showBackCard()" class="bg-blue-600 text-white px-8 py-4 rounded-xl text-xl font-bold shadow-lg hover:bg-blue-700 w-full">
              اكشف حقيقة الكارت 🔍
            </button>
          </div>
        `;
      }
      else if (currentStep === 'back') {
        const card = cards[currentCardIndex];
        const isTrap = card.type === 'trap';
        
        auctionContainer.innerHTML = `
          <div class="fade-in bg-white p-5 md:p-10 rounded-3xl shadow-xl w-full max-w-3xl text-center border mt-12 lg:mt-0">
            <div class="text-5xl md:text-7xl mb-4 ${isTrap ? 'animate-pulse' : 'animate-bounce'}">${card.backIcon}</div>
            <h2 class="text-2xl md:text-4xl font-extrabold mb-4 ${isTrap?'text-red-700':'text-emerald-700'}">${card.backTitle}</h2>
            <p class="text-slate-600 text-lg md:text-2xl mb-6">${card.backDesc}</p>
            
            <div class="${isTrap?'bg-red-50 border-red-200':'bg-emerald-50 border-emerald-200'} border p-4 rounded-2xl mb-8 text-right">
              <h3 class="font-bold text-lg mb-3 ${isTrap?'text-red-800':'text-emerald-800'} border-b pb-2 flex justify-between">
                <span>التفاصيل الحقيقية:</span>
                <span dir="ltr" class="font-black">${card.valueScore > 0 ? '+'+card.valueScore : card.valueScore} قيمة</span>
              </h3>
              <p class="text-lg ${isTrap?'text-red-900':'text-emerald-900'} font-semibold">${card.backDetails}</p>
            </div>
            
            <button onclick="nextCard()" class="bg-slate-800 text-white px-8 py-4 rounded-xl text-xl font-bold w-full">المعروض التالي ➡️</button>
          </div>
        `;
      }
    }

    function revealAllAndCalculate() {
      let maxBid = -1;
      let winners = [];
      
      teams.forEach(t => {
        let bid = currentBids[t.id] !== undefined ? currentBids[t.id] : 0;
        if (bid > maxBid) { maxBid = bid; winners = [t.id]; } 
        else if (bid === maxBid && bid > 0) { winners.push(t.id); }
      });

      if (maxBid === 0) { alert("لم يقم أي فريق بتقديم عرض!"); return; }
      if (winners.length > 1) { alert("تعادل! يجب إعادة المزايدة."); currentBids = {}; renderAuction(); return; }

      winningTeamId = winners[0];
      winningBid = maxBid;
      const team = teams.find(t => t.id === winningTeamId);
      
      if (team.budget < winningBid) {
        alert(`رصيد (${team.name}) لا يكفي! الرصيد: ${team.budget}`);
        currentBids[winningTeamId] = 0; // Disqualify illegal bid
        renderAuction();
        return;
      }

      currentStep = 'reveal_bids';
      renderAuction();
    }

    function showBackCard() {
      const team = teams.find(t => t.id === winningTeamId);
      team.budget -= winningBid;
      team.valueScore += cards[currentCardIndex].valueScore;
      currentStep = 'back';
      renderSidebars();
      renderAuction();
    }

    function startAuction() {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      currentStep = 'front';
      currentCardIndex = 0;
      currentBids = {};
      broadcast({ type: 'NEW_CARD', cardTitle: cards[currentCardIndex].frontTitle });
      renderSidebars();
      renderAuction();
    }

    function nextCard() {
      currentStep = 'front';
      currentCardIndex++;
      currentBids = {};
      if (currentCardIndex >= cards.length) {
          document.getElementById('auction-container').innerHTML = `<h1 class="text-5xl font-black text-amber-500">انتهى المزاد! 🏁</h1>`;
          return;
      }
      broadcast({ type: 'NEW_CARD', cardTitle: cards[currentCardIndex].frontTitle });
      renderAuction();
    }

  </script>
</body>
</html>
