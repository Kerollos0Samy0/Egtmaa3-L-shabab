  <style>
    body { font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
    
    /* Animations */
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .scale-in { animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    @keyframes scaleIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    
    .shake-intense { animation: shakeIntense 0.5s ease-in-out; }
    @keyframes shakeIntense {
      0%, 100% { transform: translateX(0) rotate(0); }
      20% { transform: translateX(-15px) rotate(-5deg); }
      40% { transform: translateX(15px) rotate(5deg); }
      60% { transform: translateX(-15px) rotate(-5deg); }
      80% { transform: translateX(15px) rotate(5deg); }
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    
    /* Toasts */
    #toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
    .toast { background-color: #10b981; color: white; padding: 12px 20px; border-radius: 8px; font-weight: bold; animation: fadeIn 0.3s ease-out forwards; }
  </style>
</head>

  <script>
    // --- Audio Engine (Generates sounds without external files) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    
    function initAudio() {
        if(!audioCtx) audioCtx = new AudioContext();
        if(audioCtx.state === 'suspended') audioCtx.resume();
    }
    
    function playTone(freq, type, duration, vol=0.1) {
        if(!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e){}
    }

    function playTick() { playTone(900, 'square', 0.05, 0.05); } 
    function playHammer() { playTone(150, 'square', 0.4, 0.4); } 
    function playWin() { 
        setTimeout(() => playTone(400, 'sine', 0.2, 0.15), 0);
        setTimeout(() => playTone(500, 'sine', 0.2, 0.15), 100);
        setTimeout(() => playTone(600, 'sine', 0.4, 0.15), 200);
        setTimeout(() => playTone(800, 'sine', 0.6, 0.15), 300);
    }
    function playLose() { 
        setTimeout(() => playTone(300, 'sawtooth', 0.3, 0.2), 0);
        setTimeout(() => playTone(250, 'sawtooth', 0.5, 0.2), 200);
        setTimeout(() => playTone(200, 'sawtooth', 0.8, 0.2), 400);
    }

      { type: 'treasure', frontIcon: '🏢💡', frontTitle: 'تأسيس مشروعك الخاص', frontDesc: 'بدء شركتك الخاصة أو مشروعك المستقل اللي بتحلم بيه.', frontFeatures: ['أنت مدير نفسك', 'أرباح محتملة وتطور سريع جداً'], backIcon: '💎🏆', backTitle: 'الكنز المخفي!', backDesc: 'الدرس العملي والصلابة', backDetails: 'حتى لو واجهت فشل ومشاكل في البداية، الخبرة دي بنت شخصيتك وأسست لنجاح أسطوري بعدها.' },
      { type: 'treasure', frontIcon: '🤝🔥', frontTitle: 'دائرة أصدقاء قوية', frontDesc: 'شلة مميزة وشخصياتهم قوية ومؤثرة.', frontFeatures: ['قعدة ممتعة دايماً', 'صراحة وجرأة في التعامل'], backIcon: '💎🛡️', backTitle: 'الكنز المخفي!', backDesc: 'حائط صد ضد التوهان', backDetails: 'الأصدقاء دول واجهوك بعيوبك ومنعوك تضيع، ووقفوا في ظهرك وقت الأزمات الصعبة.' },
      { type: 'treasure', frontIcon: '🧘‍♂️📚', frontTitle: 'سنة من الهدوء والاستقرار', frontDesc: 'روتين مريح، دراسة وعمل في هدوء تام.', frontFeatures: ['ابتعاد عن الدوشة والدراما', 'وقت كبير جداً لنفسك'], backIcon: '💎🔑', backTitle: 'الكنز المخفي!', backDesc: 'اكتشاف الموهبة', backDetails: 'في الصمت والملل ده، أتقنت مهارة نادرة جداً جعلتك مطلوباً ومميزاً في كل مكان.' },
      { type: 'treasure', frontIcon: '🔄🚪', frontTitle: 'فرصة لتغيير المسار', frontDesc: 'انتقال مفاجئ لمكان جديد أو مجال دراسة مختلف.', frontFeatures: ['مغامرة جديدة وتحدي', 'أشخاص جدد وبيئة مختلفة'], backIcon: '💎🚪', backTitle: 'الكنز المخفي!', backDesc: 'العناية الإلهية', backDetails: 'التغيير والرفض اللي اتعرضتله حماك من بيئة سامة كانت هتدمرك، ووجهك لاكتشاف شغفك الحقيقي.' },
      { type: 'treasure', frontIcon: '👴👑', frontTitle: 'علاقة بشخصية حكيمة VIP', frontDesc: 'شخص ناجح وخبرة بيهتم بيك وبيدعمك.', frontFeatures: ['نصائح ذهبية واسعة', 'اهتمام شخصي بتطورك'], backIcon: '💎🧭', backTitle: 'الكنز المخفي!', backDesc: 'البوصلة والمرشد', backDetails: 'الشخص ده كان صارم معاك أحياناً، بس حماك من التفكير المفرط ورجعلك سلامك الداخلي.' },
      { type: 'treasure', frontIcon: '🪙🌱', frontTitle: 'الاستقلال المالي التام', frontDesc: 'معاك اللي يغطي احتياجاتك ومفيش عليك أي ديون.', frontFeatures: ['عدم الاعتماد على أي شخص', 'مظهر بسيط ومريح'], backIcon: '💎🧘', backTitle: 'الكنز المخفي!', backDesc: 'صفر ديون = حرية مطلقة', backDetails: 'لأنك زهدت في المظاهر والماركات، تملكت راحة البال ولم تخضع لضغوط الماديات أبداً.' },

    ];

    let currentStep = 'welcome';
    let currentCardIndex = 0;

    const urlParams = new URLSearchParams(window.location.search);
    const joinId = urlParams.get('join');
    let peer;

    if (joinId) {
      document.getElementById('host-ui').style.display = 'none';
      initClient(joinId);
    } else {
      initHost();
    }

    function toggleQRModal() {
        const modal = document.getElementById('qr-modal');
        if(modal.classList.contains('hidden')) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        } else {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    }

    function toggleSidebar() {
      isSidebarVisible = !isSidebarVisible;
      const sidebar = document.getElementById('sidebar');
      const main = document.getElementById('auction-container');
      const btn = document.getElementById('sidebar-toggle-btn');
      
      if (isSidebarVisible) {
        sidebar.style.display = 'flex';
        main.classList.remove('lg:w-full');
        main.classList.add('lg:w-2/3', 'xl:w-3/4');
        if(btn) btn.innerHTML = '❯';
      } else {
        sidebar.style.display = 'none';
        main.classList.remove('lg:w-2/3', 'xl:w-3/4');
        main.classList.add('lg:w-full');
        if(btn) btn.innerHTML = '❮';
      }
    }

    function initHost() {
      peer = new Peer();
      peer.on('open', (id) => {
        let baseUrl = window.location.href.split('?')[0];
        const clientUrl = `${baseUrl}?join=${id}`;
        document.getElementById('qr-image').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(clientUrl)}`;
        document.getElementById('qr-image-large').src = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(clientUrl)}`;
      });

      peer.on('connection', (conn) => {
        conn.on('data', (data) => {
          if (data.type === 'REGISTER') {
            const newTeam = { id: teams.length + 1, name: data.name, score: 1000 };
            teams.push(newTeam);
            hostConnections[newTeam.id] = conn;
            
            conn.send({ type: 'REGISTERED', team: newTeam });
            showToast(`🎉 انضم ${newTeam.name} بنجاح!`);
            
            renderSidebars();
            if (currentStep === 'welcome') renderAuction();
            
          } else if (data.type === 'BID') {
            currentBids[data.teamId] = data.bid;
            showToast(`✅ ${teams.find(t=>t.id===data.teamId)?.name} أرسل تسعيرته`);
            if (currentStep === 'front') renderAuction(); 
          }
        });
      });

      renderSidebars();
      renderAuction();
    }

    function broadcast(data) {
      Object.values(hostConnections).forEach(conn => {
        if(conn.open) conn.send(data);
      });
    }

    function initClient(hostId) {
      const body = document.getElementById('app-body');
      body.className = "bg-slate-100 text-slate-900 flex flex-col items-center min-h-screen p-6";
      
      function renderRegister() {
        body.innerHTML = `
          <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl mt-10 text-center fade-in border border-slate-200">
             <h1 class="text-3xl font-extrabold text-blue-700 mb-6">تسجيل فريق جديد 🚀</h1>
             <input type="text" id="mobileName" class="w-full p-4 text-xl border border-slate-300 rounded-xl mb-6 text-center" placeholder="اكتب اسم فريقك هنا...">
             <button id="regBtn" onclick="registerMobile()" class="w-full py-4 bg-amber-500 hover:bg-amber-600 text-white text-xl font-bold rounded-xl disabled:opacity-50">جاري الاتصال...</button>
          </div>
        `;
      }
      renderRegister();

      peer = new Peer();
      let conn;
      let myTeam = null;
      
      peer.on('open', () => {
        conn = peer.connect(hostId);
        conn.on('open', () => {
          const btn = document.getElementById('regBtn');
          if(btn) { btn.innerText = "إنضمام للمزاد"; btn.classList.add('bg-blue-600'); }
        });

        conn.on('data', (data) => {
          if (data.type === 'REGISTERED') {
            myTeam = data.team;
            body.innerHTML = `<div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl mt-10 text-center fade-in border border-emerald-300"><div class="text-6xl mb-4">✅</div><h2 class="text-2xl font-bold text-emerald-700 mb-2">أهلاً ${myTeam.name}</h2><p class="text-slate-500 font-bold">أنت الفريق رقم ${myTeam.id}. في انتظار بدء المزاد...</p></div>`;
          } else if (data.type === 'NEW_CARD') {
            body.innerHTML = `
              <div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl mt-10 text-center fade-in border border-slate-200 relative overflow-hidden">
                 <div id="client-timer-bar" class="absolute top-0 left-0 h-2 bg-blue-500 transition-all duration-1000" style="width: 100%;"></div>
                 <div class="mt-4 flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-slate-800 truncate">المعروض: ${data.cardTitle}</h2>
                    <div id="client-timer-text" class="text-2xl font-black text-slate-700 bg-slate-100 px-3 py-1 rounded-lg border-2 border-slate-300">15</div>
                 </div>
                 <p class="text-sm text-slate-500 mb-6">أدخل السعر السري لفريقك بسرعة!</p>
                 <input type="number" id="mobileBid" class="w-full p-4 text-2xl border border-slate-300 rounded-xl mb-6 text-center" placeholder="السعر بالنقط...">
                 <button onclick="sendMobileBid()" class="w-full py-4 bg-blue-600 text-white text-2xl font-bold rounded-xl shadow-lg">إرسال السعر 🚀</button>
              </div>
            `;
          } else if (data.type === 'TIMER') {
            const tel = document.getElementById('client-timer-text');
            const bar = document.getElementById('client-timer-bar');
            if(tel && bar) {
                tel.innerText = data.time;
                bar.style.width = `${(data.time / 15) * 100}%`;
                if(data.time <= 5) {
                    tel.classList.replace('text-slate-700', 'text-red-600');
                    tel.classList.replace('bg-slate-100', 'bg-red-100');
                    tel.classList.replace('border-slate-300', 'border-red-400');
                    bar.classList.replace('bg-blue-500', 'bg-red-500');
                }
            }
          } else if (data.type === 'WAIT') {
            body.innerHTML = `<div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl mt-10 text-center fade-in border border-blue-300"><div class="text-6xl mb-4">⏳</div><h2 class="text-2xl font-bold text-blue-700 mb-2">انتهى الوقت / تم الإرسال!</h2><p class="text-slate-500 font-bold">ركز مع الشاشة الرئيسية لمعرفة النتيجة...</p></div>`;
          }
        });
      });

      window.registerMobile = function() {
        if (!conn || !conn.open) return;
        const name = document.getElementById('mobileName').value.trim();
        if(!name) { alert("اكتب اسم الفريق!"); return; }
        conn.send({ type: 'REGISTER', name: name });
      };

      window.sendMobileBid = function() {
        const bid = document.getElementById('mobileBid').value;
        if (bid === '') { alert('يرجى كتابة السعر!'); return; }
        conn.send({ type: 'BID', teamId: myTeam.id, bid: parseInt(bid) });
        conn.send({type: 'TRIGGER_WAIT_SCREEN'}); 
        body.innerHTML = `<div class="w-full max-w-md bg-white p-8 rounded-3xl shadow-xl mt-10 text-center fade-in"><h2 class="text-2xl font-bold text-emerald-600 mb-2">تم الإرسال ⏳</h2><p class="font-bold text-slate-500">مستنيين باقي الفرق والوقت يخلص!</p></div>`;
      };
    }

    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerText = message;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
    }

    function editTeamNames() {
      let changed = false;
      teams.forEach(team => {
        let newName = prompt(`أدخل الاسم الجديد لـ "${team.name}":`, team.name);
        if(newName && newName.trim() !== '') {
          team.name = newName.trim();
          changed = true;
        }
      });
      if (changed) {
        renderSidebars();
        if(currentStep === 'front' || currentStep === 'welcome') renderAuction();
      }
    }

    function renderSidebars() {
      const scoreContainer = document.getElementById('score-leaderboard');
      const sortedTeams = [...teams].sort((a, b) => b.score - a.score);

      scoreContainer.innerHTML = sortedTeams.map((t, idx) => `
        <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200 shadow-sm mb-3 transition-all duration-500">
          <div class="flex items-center gap-3">
            <span class="font-bold w-8 h-8 flex items-center justify-center rounded-full text-lg ${idx===0?'bg-amber-100 text-amber-700':'bg-slate-100 text-slate-700'}">${idx+1}</span>
            <span class="font-bold text-lg truncate">${t.name}</span>
          </div>
          <span class="font-black text-xl text-blue-700" dir="ltr">${t.score} 💰</span>
        </div>`).join('');
    }

    function startTimer() {
        clearInterval(auctionTimer);
        timeLeft = 15;
        broadcast({ type: 'TIMER', time: timeLeft });
        
        auctionTimer = setInterval(() => {
            timeLeft--;
            broadcast({ type: 'TIMER', time: timeLeft });
            
            const hostDisplay = document.getElementById('host-timer-text');
            const hostCircle = document.getElementById('host-timer-circle');
            
            if(hostDisplay) {
                hostDisplay.innerText = timeLeft;
                if(timeLeft <= 5 && timeLeft > 0) {
                    hostDisplay.classList.add('text-red-600');
                    if(hostCircle) hostCircle.classList.add('border-red-500', 'animate-pulse', 'bg-red-50');
                    playTick(); // Ticking sound effect for suspense!
                }
            }
            
            if (timeLeft <= 0) {
                clearInterval(auctionTimer);
                revealBidsScreen(); // Auto-close!
            }
        }, 1000);
    }

    function renderAuction() {
      const auctionContainer = document.getElementById('auction-container');
      const qrContainer = document.getElementById('qr-container');
      auctionContainer.innerHTML = '';
      
      // Hide QR after welcome screen
      if (qrContainer) {
          if (currentStep === 'welcome') qrContainer.style.display = 'flex';
          else qrContainer.style.display = 'none';
      }
      
      if (currentStep === 'welcome') {
        const joinedList = teams.map(t => `<span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-bold shadow-sm">${t.name} ✅</span>`).join(' ');

        auctionContainer.innerHTML = `
          <div class="fade-in bg-white p-6 md:p-10 rounded-3xl shadow-xl w-full max-w-4xl text-center border border-slate-200 mt-12 lg:mt-0">
            <div class="text-6xl md:text-8xl mb-4 md:mb-6 animate-bounce">🎙️🔨</div>
            <h1 class="text-3xl md:text-5xl font-extrabold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-amber-500 to-orange-700">مزاد القيم والوزنات</h1>
            
            <div class="my-8 bg-slate-50 p-4 rounded-xl border border-slate-200 min-h-[120px] flex flex-col justify-center">
              <h3 class="font-bold text-lg md:text-xl mb-4">الفرق المنضمة للمزاد (${teams.length}):</h3>
              <div class="flex flex-wrap gap-2 justify-center">
                ${teams.length > 0 ? joinedList : '<span class="text-slate-400 font-bold">لم ينضم أي فريق بعد.. امسح الكود للبدء! 📱</span>'}
              </div>
            </div>

            <button onclick="initAudio(); startAuction();" class="bg-blue-600 text-white px-8 py-4 rounded-2xl text-2xl font-bold shadow-lg hover:bg-blue-700 active:scale-95 transition-all disabled:opacity-50" ${teams.length < 1 ? 'disabled' : ''}>
              ${teams.length < 1 ? 'في انتظار فريق واحد على الأقل...' : 'بدء المزاد 🛒'}
            </button>
          </div>
        `;
      } 
      else if (currentStep === 'front') {
        const card = cards[currentCardIndex];
        
        const statuses = teams.map(t => {
          const hasBid = currentBids[t.id] !== undefined;
          return `
            <div class="flex items-center justify-between bg-white p-3 rounded-xl border ${hasBid ? 'border-emerald-400 bg-emerald-50' : 'border-slate-300'} shadow-sm transition-all duration-300">
              <div class="font-bold text-slate-800 text-sm md:text-lg">${t.name} (نقاطه: ${t.score})</div>
              <div class="font-bold ${hasBid ? 'text-emerald-600' : 'text-slate-400'}">${hasBid ? 'تم إرسال السعر ✅' : 'في الانتظار... ⏳'}</div>
            </div>
          `;
        }).join('');

        const allBidded = teams.every(t => currentBids[t.id] !== undefined) && teams.length > 0;

        auctionContainer.innerHTML = `
          <div class="fade-in bg-white p-5 md:p-8 rounded-3xl shadow-xl w-full max-w-4xl text-center border border-slate-200 mt-12 lg:mt-0 relative overflow-hidden">
            
            <!-- Big Timer UI -->
            <div class="absolute top-4 left-4 md:top-8 md:left-8 flex flex-col items-center">
              <div id="host-timer-circle" class="w-16 h-16 md:w-24 md:h-24 rounded-full border-4 border-blue-400 flex items-center justify-center bg-white shadow-lg transition-colors duration-500">
                <span id="host-timer-text" class="text-3xl md:text-5xl font-black text-slate-800">${timeLeft}</span>
              </div>
            </div>

            <div class="text-5xl md:text-7xl mb-3 scale-in">${card.frontIcon}</div>
            <div class="text-slate-500 font-bold text-sm mb-2">المعروض ${currentCardIndex + 1} من ${cards.length}</div>
            <h2 class="text-2xl md:text-4xl font-bold mb-3 text-slate-900">${card.frontTitle}</h2>
            <p class="text-lg md:text-xl text-slate-600 mb-4 font-semibold w-3/4 mx-auto">${card.frontDesc}</p>
            <div class="flex justify-center gap-2 mb-6 flex-wrap">
              ${card.frontFeatures.map(f => `<span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm font-bold border border-blue-200">${f}</span>`).join('')}
            </div>
            
            <div class="bg-slate-100 p-4 rounded-2xl border border-slate-200 mb-5 flex flex-col gap-3 text-right">
              <h3 class="font-bold text-base text-slate-800">حالة المزايدة (الوقت بيجري!):</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3">${statuses}</div>
            </div>

            <button onclick="revealBidsScreen()" class="bg-amber-600 text-white px-6 py-4 rounded-xl text-xl font-bold shadow-lg hover:bg-amber-700 transition-all w-full ${!allBidded ? 'opacity-90' : 'animate-pulse'}">
              ${allBidded ? 'إغلاق المزاد فوراً وإعلان الأسعار 🔨' : 'إنهاء الوقت فوراً (تخطي المنتظرين) 🔨'}
            </button>
          </div>
        `;
      } 
      else if (currentStep === 'reveal_bids') {
        const bidResults = teams.map(t => {
          const bidAmount = currentBids[t.id] !== undefined ? currentBids[t.id] : 0;
          return `
            <div class="scale-in flex flex-col items-center justify-center p-4 rounded-xl border-2 border-slate-300 bg-white shadow-sm">
              <div class="font-bold text-slate-800 text-lg mb-2 text-center">${t.name}</div>
              <div class="font-black text-4xl text-blue-700">${bidAmount}</div>
            </div>
          `;
        }).join('');

        auctionContainer.innerHTML = `
          <div class="fade-in bg-white p-5 md:p-10 rounded-3xl shadow-xl w-full max-w-5xl text-center border border-slate-200 mt-12 lg:mt-0">
            <h2 class="text-3xl font-extrabold mb-6 text-slate-800">الأسعار اللي اتسجلت في السر 🤫</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-8">${bidResults}</div>
            <p class="text-xl text-slate-600 font-bold mb-6">يا ترى المعروض ده كنز ولا فخ؟ ومين اللي كسب؟ 🤔</p>
            <button onclick="showBackCard()" class="bg-blue-600 text-white px-8 py-4 rounded-xl text-2xl font-bold shadow-lg hover:bg-blue-700 w-full animate-bounce">
              اكشف حقيقة الكارت والنتيجة 🔍
            </button>
          </div>
        `;
      }
      else if (currentStep === 'back') {
        const card = cards[currentCardIndex];
        const isTrap = card.type === 'trap';
        
        auctionContainer.innerHTML = `
          <div class="fade-in bg-white p-5 md:p-10 rounded-3xl shadow-xl w-full max-w-4xl text-center border mt-12 lg:mt-0 ${isTrap ? 'shake-intense border-red-300' : 'border-emerald-300'}">
            <div class="text-6xl md:text-8xl mb-4 ${isTrap ? 'animate-pulse' : 'animate-bounce'}">${card.backIcon}</div>
            <h2 class="text-3xl md:text-5xl font-extrabold mb-4 ${isTrap?'text-red-700':'text-emerald-700'}">${card.backTitle}</h2>
            <p class="text-slate-600 text-lg md:text-2xl mb-6 font-bold">${card.backDesc}</p>
            
            <!-- نتيجة العملية الحسابية -->
            ${lastMathResultHTML}

            <button onclick="nextCard()" class="mt-8 bg-slate-800 text-white px-8 py-4 rounded-xl text-xl font-bold w-full hover:bg-slate-900 transition-colors shadow-lg">المعروض التالي ➡️</button>
          </div>
        `;
      }
    }

    function revealBidsScreen() {
      if (teams.length === 0) return;
      clearInterval(auctionTimer); // Stop timer if manual click
      playHammer(); // BOOM! Auction closed sound
      broadcast({ type: 'WAIT' }); // Force any active mobile clients to waiting screen
      
      currentStep = 'reveal_bids';
      renderAuction();
    }

    function showBackCard() {
      const card = cards[currentCardIndex];
      const isTrap = card.type === 'trap';
      
      if (isTrap) playLose(); else playWin(); // Play result sound

      let maxBid = -1;
      let minBid = Infinity;
      
      teams.forEach(t => {
        let bid = currentBids[t.id] !== undefined ? currentBids[t.id] : 0;
        if (bid > maxBid) maxBid = bid;
        if (bid < minBid) minBid = bid;
      });

      let maxTeams = teams.filter(t => (currentBids[t.id]||0) === maxBid);
      let minTeams = teams.filter(t => (currentBids[t.id]||0) === minBid);

      lastMathResultHTML = '';

      if (isTrap) {
        lastMathResultHTML += `<div class="bg-red-50 p-5 rounded-2xl border-2 border-red-300 mt-6 text-right scale-in"><h3 class="font-extrabold text-red-800 text-2xl mb-4 text-center border-b border-red-200 pb-2">🚨 نتيـجـة الفـــخ 🚨</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-3">`;
        teams.forEach(t => {
            let bid = currentBids[t.id] || 0;
            if (minTeams.includes(t)) {
                t.score += 100; // Bonus for escaping
                lastMathResultHTML += `<div class="bg-emerald-100 text-emerald-800 p-3 rounded-lg font-bold text-base flex flex-col gap-1"><span>نجا (${t.name}) (أقل مراهن) 🎉</span><span dir="ltr" class="font-black">+100 نقطة</span></div>`;
            } else {
                t.score -= bid; // Penalty
                lastMathResultHTML += `<div class="bg-red-100 text-red-800 p-3 rounded-lg font-bold text-base flex flex-col gap-1"><span>وقع (${t.name}) في الفخ! ❌</span><span dir="ltr" class="font-black">خسر ${bid} نقطة</span></div>`;
            }
        });
        lastMathResultHTML += `</div></div>`;
      } else {
        lastMathResultHTML += `<div class="bg-emerald-50 p-5 rounded-2xl border-2 border-emerald-300 mt-6 text-right scale-in"><h3 class="font-extrabold text-emerald-800 text-2xl mb-4 text-center border-b border-emerald-200 pb-2">💎 نتيـجـة الكنـــز 💎</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-3">`;
        teams.forEach(t => {
            let bid = currentBids[t.id] || 0;
            if (maxTeams.includes(t)) {
                t.score += 300;
                lastMathResultHTML += `<div class="bg-emerald-100 text-emerald-800 p-3 rounded-lg font-bold text-base flex flex-col gap-1"><span>فاز (${t.name}) (أعلى مراهن) 🎉</span><span dir="ltr" class="font-black">+300 نقطة</span></div>`;
            } else {
                lastMathResultHTML += `<div class="bg-slate-100 text-slate-500 p-3 rounded-lg font-bold text-base flex flex-col gap-1"><span>(${t.name}) حظ أوفر..</span><span>0 نقطة</span></div>`;
            }
        });
        lastMathResultHTML += `</div></div>`;
      }

      currentStep = 'back';
      renderSidebars(); // Update scores on the left
      renderAuction();
    }

    function startAuction() {
      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      currentStep = 'front';
      currentCardIndex = 0;
      currentBids = {};
      teams.forEach(t => t.score = 1000); // Reset scores
      renderSidebars();
      
      broadcast({ type: 'NEW_CARD', cardTitle: cards[currentCardIndex].frontTitle });
      renderAuction();
      startTimer();
    }

    function nextCard() {
      currentStep = 'front';
      currentCardIndex++;
      currentBids = {};
      if (currentCardIndex >= cards.length) {
          document.getElementById('auction-container').innerHTML = `<h1 class="text-5xl font-black text-amber-500 scale-in">انتهى المزاد! 🏁</h1>`;
          playWin();
          return;
      }
      broadcast({ type: 'NEW_CARD', cardTitle: cards[currentCardIndex].frontTitle });
      renderAuction();
      startTimer();
    }

  </script>
</body>
</html>
